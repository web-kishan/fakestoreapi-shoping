<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FakeStore Api</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	
    <script>
        function GetCategories(){
             fetch("https://fakestoreapi.com/products/categories")
            .then(function(response){
                return response.json();
            })
            .then(function(data){
                data.unshift("All");
                data.map(function(item){
                    var option = document.createElement("option");
                    option.text = item.toUpperCase();
                    option.value = item;
                    document.getElementById("lstCategories").appendChild(option);
                })
            })
        }
        function GetProducts(url){
            document.getElementById("productsContainer").innerHTML="";
             fetch(url)
            .then(function(response){
                return response.json();
            })
            .then(function(product){
                product.map(function(item){
                    var div = document.createElement("div");
                    div.className = "card m-2 p-2";
                    div.style.width = "250px";
                   
                    div.innerHTML = `
                        <img src=${item.image} class="card-img-top" height="150">
                        <div class="card-header" style="height:150px; text-align:justify;">
                            <p>${item.title}</p>
                        </div>
                        <div class="card-body">
                            <p>Price :- ${item.price}</p>
                            <p>Rating :- ${item.rating.rate}</p>
                            <p>Count :- ${item.rating.count}</p>
                        </div>
                         <div class="card-footer">
                            <button onclick="AddToCartClick(${item.id})" class="btn btn-danger w-100">
                                <span class="bi bi-cart4"></span>
                                    Add to Cart
                            </button>
                        </div>
                    `;
                    document.getElementById("productsContainer").appendChild(div);

                })
            })
        }
        function bodyload(){
           GetCategories();
           GetProducts("https://fakestoreapi.com/products");
           GetCartItemCount();
        }

        function CategoryChange(){
            var categoryName = document.getElementById("lstCategories").value;
           // console.log(categoryName);
           if(categoryName=="All"){
            GetProducts("https://fakestoreapi.com/products");
           }else{
            GetProducts(`https://fakestoreapi.com/products/category/${categoryName}`);
           }
           
        }
        var cartItems = []; //empty array
        var count = 0;
        function GetCartItemCount(){
            count = cartItems.length;
            document.getElementById("cartCount").innerHTML = count;
        }
        function AddToCartClick(id){
           // alert(id);
           fetch(`https://fakestoreapi.com/products/${id}`)
           .then(function(response){
            return response.json();
           })
           .then(function(data){
            cartItems.push(data);
            alert(`${data.title} Item Add to Cart`);
            GetCartItemCount();
           })
        }
        function ShowCartClick(){
            document.querySelector("tbody").innerHTML = "";
            cartItems.map(function(item){
                var tr = document.createElement("tr");
                var tdTitle = document.createElement("td");
                var tdPrice = document.createElement("td");
                var tdPhoto = document.createElement("td");

                tdTitle.innerHTML = item.title;
                tdPrice.innerHTML = item.price;
                var img = document.createElement("img");
                img.src = item.image;
                img.width = "100";
                img.height = "100";
                tdPhoto.appendChild(img);
                tr.appendChild(tdTitle);
                tr.appendChild(tdPrice);
                tr.appendChild(tdPhoto);

                document.querySelector("tbody").appendChild(tr);
            })
        }
    </script>
</head>
<body class="container-fluid" onload="bodyload()">
    <div class="row">
        <header class="bg-danger text-white text-center p-2">
            <h1><span class="bi bi-cart4"></span>Shoping Online</h1>
        </header>

        <div class="col-2 mt-3">
            <h3>Select a Category</h3>
            <select class="form-select" id="lstCategories" onchange="CategoryChange()">

            </select>
        </div>

        <div class="col-8">
            <div id="productsContainer" class="d-flex flex-wrap overflow-auto" style="height: 500px;">

            </div>
        </div>
        <div class="col-2">
            <button onclick="ShowCartClick()" class="btn btn-warning mt-3" data-bs-target="#cart" data-bs-toggle="modal">
                [<span id="cartCount"></span>]
                <span class="bi bi-cart3"></span>
                    Your Cart Item
            </button>

            <div class="modal fade" id="cart">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>Your Cart Item</h3>
                            <button class="btn btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Price</th>
                                        <th>Preview</th>
                                    </tr>
                                </thead>
                                <tbody>

                                </tbody>
                            </table>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-success" data-bs-dismiss="modal">Ok</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
